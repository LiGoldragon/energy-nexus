[package]
name="energy-nexus-translator"
version="0.1.0"
edition.workspace=true
rust-version.workspace=true

[dependencies]
energy-nexus-emission={path="../emission"}
energy-nexus-wire={path="../wire"}
signal-energy-nexus={workspace=true,features=["datom"]}
meta-signal-energy-nexus={workspace=true,features=["datom"]}
signal.workspace=true
datom-codec={git="https://github.com/LiGoldragon/datom-codec",rev="e26d90ff185d54bc0007b19a8d9bc390c6bfeb12"}
protos={git="https://github.com/LiGoldragon/protos",rev="15b41da8f2579e73ead59bc0c2b97529b8ac32d3"}
shared-translator={package="translator",git="https://github.com/LiGoldragon/translator",rev="751c326f11c874b527a69ce6377ce9e196aeca37",features=["text"]}
serde_json="1"
ureq="3"
time={version="0.3",features=["parsing"]}
tempfile="3"

