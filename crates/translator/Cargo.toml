[package]
name="energy-nexus-translator"
version = "0.4.0"
edition.workspace=true
rust-version.workspace=true

[dependencies]
energy-nexus-emission={path="../emission"}
energy-nexus-wire={path="../wire"}
signal-energy-nexus={workspace=true,features=["datom"]}
signal-flow.workspace=true
meta-signal-energy-nexus={workspace=true,features=["datom"]}
signal.workspace=true
datom-codec={git="https://github.com/LiGoldragon/datom-codec",rev="09a0526"}
protos={git="https://github.com/LiGoldragon/protos",rev="c93b598"}
serde_json="1"
ureq="3"
time={version="0.3",features=["parsing"]}
tempfile="3"
nix={version="0.30",features=["socket","signal","inotify","event"]}
rkyv.workspace=true

[dev-dependencies]
nix={version="0.30",features=["socket","signal"]}
