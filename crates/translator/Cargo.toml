[package]
name="energy-nexus-translator"
version = "0.2.0"
edition.workspace=true
rust-version.workspace=true

[dependencies]
energy-nexus-emission={path="../emission"}
energy-nexus-wire={path="../wire"}
signal-energy-nexus={workspace=true,features=["datom"]}
signal-flow={git="https://github.com/LiGoldragon/signal-flow",rev="9f159d91f5ed08b161fe99da7f964434e4e584d5",default-features=false}
meta-signal-energy-nexus={workspace=true,features=["datom"]}
signal.workspace=true
datom-codec={git="https://github.com/LiGoldragon/datom-codec",rev="eabead4"}
protos={git="https://github.com/LiGoldragon/protos",rev="3c7ade3"}
serde_json="1"
ureq="3"
time={version="0.3",features=["parsing"]}
tempfile="3"
nix={version="0.30",features=["socket"]}
rkyv.workspace=true
