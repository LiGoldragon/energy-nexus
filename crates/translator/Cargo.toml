[package]
name="energy-nexus-translator"
version="0.1.0"
edition.workspace=true
rust-version.workspace=true

[dependencies]
energy-nexus-emission={path="../emission"}
energy-nexus-wire={path="../wire"}
signal-energy-nexus={workspace=true,features=["datom"]}
signal-flow={git="https://github.com/LiGoldragon/signal-flow",rev="9abc0227c3323743826447ead18cb7697a45a9c7",default-features=false}
meta-signal-energy-nexus={workspace=true,features=["datom"]}
signal.workspace=true
datom-codec={git="https://github.com/LiGoldragon/datom-codec",rev="4dff16b4f7412febc3b71aac8b49680cd20988cb"}
protos={git="https://github.com/LiGoldragon/protos",rev="15b41da8f2579e73ead59bc0c2b97529b8ac32d3"}
serde_json="1"
ureq="3"
time={version="0.3",features=["parsing"]}
tempfile="3"
nix={version="0.30",features=["socket"]}
rkyv.workspace=true
