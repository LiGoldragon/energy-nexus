[workspace]
members = ["crates/core", "crates/emission", "crates/wire", "crates/daemon", "crates/translator"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
signal-energy-nexus = { git = "https://github.com/LiGoldragon/signal-energy-nexus", rev = "7ca10ebccdc674bbd96489ceff3e2a43d32d6ec3", default-features = false }
meta-signal-energy-nexus = { git = "https://github.com/LiGoldragon/meta-signal-energy-nexus", rev = "3264d6f36013ca823b60bdfbc3e10c5f6370f482", default-features = false }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "6d4eb74", default-features = false }
signal-flow = { git = "https://github.com/LiGoldragon/signal-flow", rev = "4982eeb6f8b2ef8a86a0070dc02acaf0f2088272", default-features = false }
tokio = { version = "1", default-features = false }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
