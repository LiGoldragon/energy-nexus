[workspace]
members = ["crates/core", "crates/emission", "crates/wire", "crates/daemon", "crates/translator"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
signal-energy-nexus = { git = "https://github.com/LiGoldragon/signal-energy-nexus", rev = "3c59145aa04b76cfbf139d49eb8cf9a4d8a02c04", default-features = false }
meta-signal-energy-nexus = { git = "https://github.com/LiGoldragon/meta-signal-energy-nexus", rev = "3480f2af9dc45646426c4fdd1f6ce438b624b286", default-features = false }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "e0e3c05573405e793037205640e54cfd769bb1b4", default-features = false }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
