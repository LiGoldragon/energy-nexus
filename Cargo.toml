[workspace]
members = ["crates/core", "crates/emission", "crates/wire", "crates/daemon", "crates/translator"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
signal-energy-nexus = { git = "https://github.com/LiGoldragon/signal-energy-nexus", rev = "5927259e5c91c13c02707db2b185803d06d471a7", default-features = false }
meta-signal-energy-nexus = { git = "https://github.com/LiGoldragon/meta-signal-energy-nexus", rev = "05d8c5caa5328e056d84a6d6942cb3f0ba8d3dbb", default-features = false }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "6d4eb74", default-features = false }
signal-flow = { git = "https://github.com/LiGoldragon/signal-flow", rev = "319e3c3f8502e1c4356bd499bf8949905e6fd3c8", default-features = false }
# The owner's time zone: the system's, or a configured IANA name read from the
# bundled database, so a name resolves alike on every host and in every build.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
tokio = { version = "1", default-features = false }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
